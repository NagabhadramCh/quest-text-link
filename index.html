<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Type your details</title>
<!-- Official Artemis Web SDK build served by the platform (exposes window.AgentSDK). -->
<script src="https://agents.kore.ai/api/sdk/embed/script"></script>
<style>
  :root {
    --bg: #f5f7f8; --card: #ffffff; --text: #1d2327; --muted: #5b6770; --line: #d5dde2;
    --accent: #0b6e4f; --accent-text: #ffffff; --error: #b3261e; --ok-bg: #e7f4ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111518; --card: #1a2024; --text: #e8edf0; --muted: #a3b0b8; --line: #2f383e;
      --accent: #3fb08a; --accent-text: #08130e; --error: #f2b8b5; --ok-bg: #16302a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  .hint { display: block; color: var(--muted); font-weight: 400; font-size: .9rem; }
  input { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  button { width: 100%; margin-top: 20px; padding: 14px; font: inherit; font-size: 1.05rem; font-weight: 700; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  .err { color: var(--error); font-size: .95rem; margin-top: 8px; min-height: 1.2em; }
  .done { background: var(--ok-bg); border-radius: 10px; padding: 16px; }
  .foot { color: var(--muted); font-size: .85rem; margin-top: 16px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Quest Diagnostics test results line</h1>
    <p class="sub" id="lead" role="status">Opening a secure session…</p>

    <form id="form" hidden novalidate autocomplete="off">
      <div id="accountFields" hidden>
        <label for="account">Quest account number
          <span class="hint">4 to 8 digits, as on your Quest paperwork</span></label>
        <input id="account" name="account" inputmode="numeric" pattern="[0-9 ]*" maxlength="12" autocomplete="off">
      </div>
      <div id="patientFields" hidden>
        <label for="first">Patient first name</label>
        <input id="first" name="first" maxlength="40" autocomplete="off" autocapitalize="words">
        <label for="last">Patient last name</label>
        <input id="last" name="last" maxlength="40" autocomplete="off" autocapitalize="words">
        <label for="dob">Patient date of birth</label>
        <input id="dob" name="dob" type="date" min="1900-01-01">
      </div>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
      <button type="submit" id="submit">Submit</button>
    </form>

    <div class="done" id="done" hidden role="status"></div>
  </div>
  <p class="foot">This one-time link works once, for 5 minutes after it was sent. Please don't share it.</p>
</main>
<script>
(function () {
  'use strict';
  // Artemis Web SDK (hosted exchange): the texted link carries a single-use, server-minted bootstrap token for the
  // caller's verified number. The typed value is sent as a message in that verified Web SDK session; the Quest agent
  // checks it and saves it for the call. This page never stores or forwards anything itself.
  var ENDPOINT = 'https://agents.kore.ai';
  var PROJECT_ID = '01a1ab58-3e51-7b07-a103-84ebb7bc80a1';

  var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  var bt = hash.get('bt') || '';
  var fields = hash.get('f') === 'patient' ? 'patient' : 'account';
  // The token is single-use: drop it from the address bar and history right away.
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var lead = $('lead'), form = $('form'), err = $('err'), btn = $('submit'), done = $('done');
  var chat = null;

  function stop(msg) { lead.textContent = msg; form.hidden = true; }
  function finish(msg) { form.hidden = true; lead.hidden = true; done.textContent = msg; done.hidden = false; }

  function assistantTexts() {
    var list = (chat && chat.getMessages()) || [];
    return list.filter(function (m) { return m && m.role === 'assistant'; })
      .map(function (m) { return String(m.content || m.text || ''); });
  }

  // Waits for the agent's next reply after a send (the reply to this value).
  function nextReply(seen, timeoutMs) {
    return new Promise(function (resolve) {
      var start = Date.now();
      (function poll() {
        var texts = assistantTexts();
        if (texts.length > seen) return resolve(texts[texts.length - 1]);
        if (Date.now() - start > timeoutMs) return resolve('');
        setTimeout(poll, 300);
      })();
    });
  }

  function values() {
    if (fields === 'account') {
      var d = $('account').value.replace(/[^0-9]/g, '');
      if (d.length < 4 || d.length > 8) return { error: 'Enter the 4 to 8 digit account number.' };
      return { text: d };
    }
    var clean = function (s) { return s.replace(/[^A-Za-z' .-]/g, '').replace(/\s+/g, ' ').trim(); };
    var first = clean($('first').value), last = clean($('last').value), dob = $('dob').value;
    var today = new Date().toISOString().slice(0, 10);
    if (!first || !last) return { error: "Enter the patient's first and last name." };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dob) || dob > today || dob < '1900-01-01') return { error: 'Enter a valid date of birth.' };
    return { text: first + '|' + last + '|' + dob };
  }

  async function start() {
    if (!bt) { stop('This link is not valid. Please ask for a new one on your call.'); return; }
    // The embed script exposes the SDK class as window.AgentSDK (older builds: window.AgentSDK.AgentSDK).
    var SDKClass = (window.AgentSDK && window.AgentSDK.AgentSDK) || (typeof window.AgentSDK === 'function' ? window.AgentSDK : null);
    if (!SDKClass) { stop('Could not load the secure session. Please continue on your call.'); return; }
    try {
      var sdk = new SDKClass({ endpoint: ENDPOINT, projectId: PROJECT_ID, bootstrapToken: bt });
      await sdk.connect();
      chat = sdk.chat();
    } catch (e) {
      stop('This link has expired or was already used. Please ask for a new one on your call.');
      return;
    }
    lead.textContent = fields === 'patient'
      ? "Type the patient's name and date of birth, then tap Submit."
      : 'Type your Quest account number, then tap Submit.';
    $(fields === 'patient' ? 'patientFields' : 'accountFields').hidden = false;
    $('dob').max = new Date().toISOString().slice(0, 10);
    form.hidden = false;
    (fields === 'patient' ? $('first') : $('account')).focus();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var x = values();
    if (x.error) { err.textContent = x.error; return; }
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Sending…';
    var seen = assistantTexts().length;
    try {
      await chat.send(x.text);
    } catch (e2) {
      btn.disabled = false; btn.textContent = 'Submit';
      err.textContent = 'Something went wrong. Please try again, or say your details on the call.';
      return;
    }
    var reply = await nextReply(seen, 20000);
    if (/we have it/i.test(reply)) { finish(reply); return; }
    if (/no longer active/i.test(reply)) { stop(reply); return; }
    btn.disabled = false; btn.textContent = 'Submit';
    err.textContent = reply || 'No answer yet. Please try again, or say your details on the call.';
  });

  start();
})();
</script>
</body>
</html>
